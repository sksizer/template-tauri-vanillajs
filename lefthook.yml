commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    eslint:
      root: src-web/
      glob: '*.{js,mjs}'
      run: pnpm eslint {staged_files}
    clippy:
      root: src-tauri/
      glob: '*.rs'
      priority: 2
      run: cargo clippy -- -D warnings
    rustfmt:
      root: src-tauri/
      glob: '*.rs'
      priority: 1
      run: cargo fmt -- --check
    prettier:
      root: src-web/
      glob: '*.{js,css,json,md,yml,yaml,mjs,html}'
      run: pnpm prettier --check {staged_files}
